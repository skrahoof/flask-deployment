- name: Deploy Flask App with NGINX
  hosts: web
  become: yes
  tasks:
    - name: Install required packages
      apt:
        name:
          - python3-pip
          - python3-venv
          - nginx
        state: present
        update_cache: yes

    - name: Create app directory
      file:
        path: /home/ubuntu/app
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: 0755

    - name: Copy Flask app
      copy:
        src: ../app/
        dest: /home/ubuntu/app/
        mode: 0755

    - name: Create virtual environment
      become_user: ubuntu
      command: python3 -m venv /home/ubuntu/app/venv

    - name: Install Flask in venv
      become_user: ubuntu
      command: /home/ubuntu/app/venv/bin/pip install flask

    - name: Run Flask app
      shell: nohup /home/ubuntu/app/venv/bin/python /home/ubuntu/app/app.py &

    - name: Copy NGINX config
      copy:
        src: ../nginx/default.conf
        dest: /etc/nginx/sites-available/default

    - name: Restart NGINX
      service:
        name: nginx
        state: restarted
