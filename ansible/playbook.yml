- name: Deploy Flask App with NGINX
  hosts: web
  become: yes
  tasks:
    - name: Install required packages
      apt:
        name:
          - python3-pip
          - nginx
        state: present
        update_cache: yes

    - name: Install Flask
      pip:
        name: flask

    - name: Create app directory
      file:
        path: /home/ubuntu/app
        state: directory
        mode: '0755'
        owner: ubuntu

    - name: Copy Flask app
      copy:
        src: app/
        dest: /home/ubuntu/app/
        mode: '0755'
        owner: ubuntu
        group: ubuntu

    - name: Run Flask app
      shell: nohup python3 /home/ubuntu/app/app.py > /home/ubuntu/app.log 2>&1 &
      args:
        chdir: /home/ubuntu/app
        creates: /home/ubuntu/app.log

    - name: Copy NGINX config
      copy:
        src: nginx/default.conf
        dest: /etc/nginx/sites-available/default
        owner: root
        group: root
        mode: '0644'

    - name: Restart NGINX
      service:
        name: nginx
        state: restarted
