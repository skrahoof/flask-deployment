name: Deploy to EC2

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Ansible
        run: |
          sudo apt update
          sudo apt install -y ansible

      - name: Add SSH key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > assessment1.pem
          chmod 600 assessment1.pem

      - name: Run Ansible Playbook
        env:
          ANSIBLE_HOST_KEY_CHECKING: false
        run: |
          ansible-playbook ansible/playbook.yml -i ansible/inventory.ini --private-key assessment1.pem
